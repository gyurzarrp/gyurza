<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GYURZA — МОПСОБОЙ</title><style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#05080c;
    touch-action:none;
}

button{
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#05080c;
}

#background{
    position:absolute;
    inset:-35px;
    background-image:
        linear-gradient(rgba(3,8,14,.25),rgba(3,8,14,.58)),
        url("https://masterpiecer-images.s3.yandex.net/ee7fbde09b5411ee8d617a83974e0feb:upscaled");
    background-size:cover;
    background-position:center;
    filter:blur(7px);
    transform:scale(1.06);
    z-index:0;
}

#dark{
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 50% 40%,rgba(22,151,211,.12),transparent 45%),
        rgba(2,6,11,.42);
    z-index:1;
}

#playArea{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:10;
}

#hud{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:none;
    justify-content:space-between;
    z-index:100;
}

.hud{
    padding:11px 15px;
    border-radius:14px;
    background:rgba(3,8,14,.82);
    border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(12px);
    color:white;
    font-size:14px;
    font-weight:800;
}

#score{color:#35c2ff}
#lives{color:#ff5269;letter-spacing:3px}

#player{
    position:absolute;
    width:76px;
    height:76px;
    object-fit:contain;
    display:none;
    z-index:30;
    pointer-events:none;
    filter:drop-shadow(0 8px 15px rgba(0,0,0,.55));
}

.mops{
    position:absolute;
    width:57px;
    height:57px;
    object-fit:contain;
    z-index:20;
    pointer-events:none;
    filter:drop-shadow(0 7px 10px rgba(0,0,0,.4));
}

/* МЕНЮ */

#menu{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.menuCard{
    position:relative;
    width:min(850px,94vw);
    min-height:480px;
    display:flex;
    align-items:center;
    overflow:hidden;
    border-radius:32px;
    background:
        linear-gradient(135deg,
        rgba(7,15,24,.91),
        rgba(5,10,17,.78));
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 35px 100px rgba(0,0,0,.7);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}

.menuCard::before{
    content:"";
    position:absolute;
    width:380px;
    height:380px;
    right:-160px;
    bottom:-170px;
    background:#009fe8;
    opacity:.12;
    filter:blur(100px);
    pointer-events:none;
}

.menuText{
    position:relative;
    z-index:10;
    width:57%;
    padding:55px;
}

.smallTitle{
    color:#35c2ff;
    font-size:11px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:16px;
}

.logo{
    color:white;
    font-size:clamp(48px,7vw,76px);
    line-height:.95;
    font-weight:900;
    letter-spacing:-4px;
}

.logo span{color:#35c2ff}

.subtitle{
    margin-top:13px;
    color:#71818f;
    font-size:12px;
    font-weight:800;
    letter-spacing:4px;
}

.description{
    margin-top:28px;
    color:#aebbc6;
    font-size:14px;
    line-height:1.7;
    max-width:390px;
}

.description b{color:white}

.record{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:24px;
    padding:10px 14px;
    border-radius:12px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    color:#8c9aa6;
    font-size:11px;
    font-weight:800;
}

.record strong{
    color:#35c2ff;
    font-size:16px;
}

#startButton{
    position:relative;
    z-index:100;
    display:block;
    margin-top:24px;
    width:220px;
    min-height:56px;
    border:0;
    border-radius:15px;
    background:#35c2ff;
    color:#001018;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
    pointer-events:auto;
    box-shadow:0 10px 35px rgba(53,194,255,.25);
}

#startButton:active{
    transform:scale(.96);
}

.menuCharacter{
    position:absolute;
    right:-25px;
    bottom:-15px;
    width:52%;
    height:105%;
    object-fit:contain;
    object-position:center bottom;
    z-index:3;
    pointer-events:none;
    filter:drop-shadow(0 20px 35px rgba(0,0,0,.55));
}

.menuGradient{
    position:absolute;
    inset:0;
    z-index:4;
    pointer-events:none;
    background:
        linear-gradient(90deg,
        rgba(5,10,17,.96) 0%,
        rgba(5,10,17,.88) 40%,
        rgba(5,10,17,.18) 78%,
        rgba(5,10,17,.05) 100%);
}

/* GAME OVER */

#gameOver{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:2000;
    background:rgba(2,6,10,.65);
    backdrop-filter:blur(12px);
}

.overCard{
    width:min(400px,92vw);
    padding:35px 25px;
    text-align:center;
    border-radius:25px;
    background:rgba(7,14,22,.96);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 30px 80px rgba(0,0,0,.7);
}

.overTitle{
    color:white;
    font-size:36px;
    font-weight:900;
}

.overSub{
    margin-top:8px;
    color:#73818d;
    font-size:11px;
    letter-spacing:2px;
}

.finalScore{
    margin:25px 0;
    color:#35c2ff;
    font-size:55px;
    font-weight:900;
}

.overButton{
    width:100%;
    min-height:52px;
    border:0;
    border-radius:13px;
    background:#35c2ff;
    color:#001018;
    font-weight:900;
    cursor:pointer;
}

.overButton.second{
    margin-top:9px;
    background:#16232e;
    color:white;
}

/* РАУНД */

#round{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(.8);
    opacity:0;
    color:white;
    font-size:45px;
    font-weight:900;
    z-index:80;
    pointer-events:none;
    transition:.2s;
}

#round.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media(max-width:700px){

    .menuCard{
        min-height:570px;
        align-items:flex-start;
        border-radius:26px;
    }

    .menuText{
        width:100%;
        padding:34px 25px;
        z-index:10;
    }

    .logo{font-size:52px}

    .subtitle{font-size:9px}

    .description{
        max-width:270px;
        font-size:13px;
    }

    .menuCharacter{
        width:82%;
        height:65%;
        right:-55px;
        bottom:0;
        opacity:.72;
    }

    .menuGradient{
        background:
            linear-gradient(180deg,
            rgba(5,10,17,.98) 0%,
            rgba(5,10,17,.93) 45%,
            rgba(5,10,17,.25) 100%);
    }

    #startButton{
        width:100%;
        max-width:300px;
    }

    #player{
        width:68px;
        height:68px;
    }

    .mops{
        width:52px;
        height:52px;
    }
}
</style></head><body><div id="game"><div id="background"></div>
<div id="dark"></div><div id="playArea"><div id="hud">
    <div class="hud">
        ❤️ <span id="lives">♥♥♥</span>
    </div>

    <div class="hud">
        ⭐ <span id="score">0</span>
    </div>
</div>

<img id="player"
     src="https://i.imgur.com/W3JkRuj.png"
     alt="Гюрза">

<div id="round">РАУНД 1</div>

</div><!-- ГЛАВНОЕ МЕНЮ --><div id="menu"><div class="menuCard">

    <div class="menuText">

        <div class="smallTitle">
            OFFICIAL GAME
        </div>

        <div class="logo">
            GYURZA<span>.</span>
        </div>

        <div class="subtitle">
            МОПСОБОЙ
        </div>

        <div class="description">
            <b>Уворачивайся от мопсов.</b>
            <br>
            Двигай Гюрзу влево и вправо,
            избегай столкновений и набирай
            как можно больше очков.
            <br><br>
            Чем выше счёт — тем больше
            мопсов появляется.
        </div>

        <div class="record">
            🏆 РЕКОРД:
            <strong id="record">0</strong>
        </div>

        <!-- НИКАКИХ КНОПОК СВАЙПА ЗДЕСЬ НЕТ -->

        <button id="startButton"
                type="button"
                onclick="startGame()">
            ▶ НАЧАТЬ ИГРУ
        </button>

    </div>

    <img class="menuCharacter"
         src="https://i.imgur.com/W3JkRuj.png"
         alt="GYURZA">

    <div class="menuGradient"></div>

</div>

</div><!-- GAME OVER --><div id="gameOver"><div class="overCard">

    <div class="overTitle">
        ИГРА ОКОНЧЕНА
    </div>

    <div class="overSub">
        МОПСЫ ДОБРАЛИСЬ ДО ГЮРЗЫ
    </div>

    <div class="finalScore"
         id="finalScore">
        0
    </div>

    <div id="newRecord"
         style="display:none;color:#50df92;font-weight:900;margin-bottom:18px">
        🏆 НОВЫЙ РЕКОРД!
    </div>

    <button class="overButton"
            type="button"
            onclick="startGame()">
        ИГРАТЬ СНОВА
    </button>

    <button class="overButton second"
            type="button"
            onclick="showMenu()">
        В МЕНЮ
    </button>

</div>

</div></div><script>
"use strict";

/* КАРТИНКИ */

const PLAYER_IMAGE =
    "https://i.imgur.com/W3JkRuj.png";

const MOP_IMAGE =
    "https://i.imgur.com/URTeVWx.png";


/* СОСТОЯНИЕ */

let playing = false;
let score = 0;
let lives = 3;
let round = 1;
let playerX = 0;
let enemies = [];
let lastTime = 0;
let spawnTimer = 0;
let hitCooldown = 0;
let animationId = null;


/* ЭЛЕМЕНТЫ */

const player = document.getElementById("player");
const hud = document.getElementById("hud");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const menu = document.getElementById("menu");
const gameOver = document.getElementById("gameOver");
const recordEl = document.getElementById("record");
const finalScore = document.getElementById("finalScore");
const newRecord = document.getElementById("newRecord");
const roundEl = document.getElementById("round");


/* РЕКОРД */

function getRecord(){
    return Number(localStorage.getItem("gyurza_mops_record") || 0);
}

function saveRecord(value){
    localStorage.setItem("gyurza_mops_record", String(value));
}

function updateRecord(){
    recordEl.textContent = getRecord();
}

updateRecord();


/* ЗАПУСК ИГРЫ */

function startGame(){

    /* если старая игра ещё работает — останавливаем */

    playing = false;

    if(animationId){
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    /* удаляем всех старых мопсов */

    for(const enemy of enemies){
        if(enemy.el){
            enemy.el.remove();
        }
    }

    enemies = [];

    /* сбрасываем игру */

    score = 0;
    lives = 3;
    round = 1;
    spawnTimer = 0;
    hitCooldown = 0;

    /* скрываем меню */

    menu.style.display = "none";
    gameOver.style.display = "none";

    /* показываем игру */

    hud.style.display = "flex";
    player.style.display = "block";
    player.src = PLAYER_IMAGE;

    /* позиция Гюрзы */

    const playerWidth = player.offsetWidth || 76;

    playerX =
        (window.innerWidth - playerWidth) / 2;

    player.style.left =
        playerX + "px";

    player.style.bottom =
        "95px";

    player.style.top =
        "auto";

    updateHUD();

    showRound();

    /* запускаем */

    playing = true;
    lastTime = performance.now();

    animationId =
        requestAnimationFrame(gameLoop);
}


/* ИГРОВОЙ ЦИКЛ */

function gameLoop(time){

    if(!playing){
        return;
    }

    let delta =
        (time - lastTime) / 1000;

    lastTime = time;

    if(delta > 0.05){
        delta = 0.05;
    }

    if(hitCooldown > 0){
        hitCooldown -= delta;
    }

    movePlayer(delta);
    moveEnemies(delta);

    spawnTimer += delta;

    /* постепенно появляется больше мопсов */

    const spawnDelay =
        Math.max(
            0.38,
            1.05 - round * 0.045
        );

    if(spawnTimer >= spawnDelay){

        spawnTimer = 0;

        spawnEnemy();

        /* после определённого счёта иногда второй */

        if(score >= 35 && Math.random() < 0.20){
            spawnEnemy();
        }

        if(score >= 80 && Math.random() < 0.18){
            spawnEnemy();
        }
    }

    const newRound =
        Math.floor(score / 20) + 1;

    if(newRound > round){

        round = newRound;
        showRound();
    }

    animationId =
        requestAnimationFrame(gameLoop);
}


/* ДВИЖЕНИЕ ГЮРЗЫ */

function movePlayer(delta){

    /* управление свайпом задаёт targetX */

    if(typeof window.targetX === "number"){

        playerX +=
            (window.targetX - playerX) *
            Math.min(1, delta * 12);
    }

    /* клавиатура */

    if(window.leftKey){
        playerX -= 430 * delta;
    }

    if(window.rightKey){
        playerX += 430 * delta;
    }

    const width =
        player.offsetWidth || 76;

    const max =
        window.innerWidth - width - 5;

    playerX =
        Math.max(
            5,
            Math.min(max, playerX)
        );

    player.style.left =
        playerX + "px";
}


/* СОЗДАНИЕ МОПСА */

function spawnEnemy(){

    if(!playing){
        return;
    }

    const mop =
        document.createElement("img");

    mop.className = "mops";
    mop.src = MOP_IMAGE;
    mop.draggable = false;

    const size =
        window.innerWidth < 700 ? 52 : 57;

    mop.style.width = size + "px";
    mop.style.height = size + "px";

    const maxX =
        Math.max(
            5,
            window.innerWidth - size - 5
        );

    const x =
        5 + Math.random() * maxX;

    const y = -75;

    mop.style.left = x + "px";
    mop.style.top = y + "px";

    document.getElementById("playArea")
        .appendChild(mop);

    enemies.push({

        el: mop,
        x: x,
        y: y,
        size: size,

        speed:
            145 +
            round * 6 +
            Math.random() * 35
    });
}


/* ДВИЖЕНИЕ МОПСОВ */

function moveEnemies(delta){

    const playerRect =
        player.getBoundingClientRect();

    for(
        let i = enemies.length - 1;
        i >= 0;
        i--
    ){

        const enemy =
            enemies[i];

        enemy.y +=
            enemy.speed * delta;

        enemy.el.style.top =
            enemy.y + "px";

        const enemyRect =
            enemy.el.getBoundingClientRect();

        /* столкновение */

        if(
            hitCooldown <= 0 &&
            isColliding(playerRect, enemyRect)
        ){

            enemy.el.remove();
            enemies.splice(i,1);

            loseLife();

            continue;
        }

        /* мопс улетел вниз — считаем очко */

        if(enemy.y > window.innerHeight + 80){

            enemy.el.remove();
            enemies.splice(i,1);

            score++;

            updateHUD();
        }
    }
}


/* ПРОВЕРКА СТОЛКНОВЕНИЯ */

function isColliding(a,b){

    const padding = 13;

    return !(
        a.right - padding < b.left + padding ||
        a.left + padding > b.right - padding ||
        a.bottom - padding < b.top + padding ||
        a.top + padding > b.bottom - padding
    );
}


/* ПОТЕРЯ ЖИЗНИ */

function loseLife(){

    if(hitCooldown > 0){
        return;
    }

    hitCooldown = 1.0;

    lives--;

    updateHUD();

    /* небольшой визуальный эффект */

    player.style.transform =
        "scale(1.18)";

    setTimeout(function(){

        player.style.transform =
            "scale(1)";

    },180);

    if(lives <= 0){

        endGame();
    }
}


/* HUD */

function updateHUD(){

    scoreEl.textContent =
        score;

    livesEl.textContent =
        "♥".repeat(Math.max(0,lives)) +
        "♡".repeat(Math.max(0,3-lives));
}


/* РАУНД */

function showRound(){

    roundEl.textContent =
        "РАУНД " + round;

    roundEl.classList.add("show");

    setTimeout(function(){

        roundEl.classList.remove("show");

    },700);
}


/* GAME OVER */

function endGame(){

    playing = false;

    if(animationId){
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    for(const enemy of enemies){

        if(enemy.el){
            enemy.el.remove();
        }
    }

    enemies = [];

    finalScore.textContent =
        score;

    const oldRecord =
        getRecord();

    if(score > oldRecord){

        saveRecord(score);

        newRecord.style.display =
            "block";

    }else{

        newRecord.style.display =
            "none";
    }

    updateRecord();

    hud.style.display =
        "none";

    player.style.display =
        "none";

    gameOver.style.display =
        "flex";
}


/* В МЕНЮ */

function showMenu(){

    playing = false;

    if(animationId){
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    for(const enemy of enemies){

        if(enemy.el){
            enemy.el.remove();
        }
    }

    enemies = [];

    gameOver.style.display =
        "none";

    hud.style.display =
        "none";

    player.style.display =
        "none";

    menu.style.display =
        "flex";

    updateRecord();
}


/* КЛАВИАТУРА */

window.leftKey = false;
window.rightKey = false;

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "ArrowLeft"){
            window.leftKey = true;
            event.preventDefault();
        }

        if(event.key === "ArrowRight"){
            window.rightKey = true;
            event.preventDefault();
        }
    }
);

document.addEventListener(
    "keyup",
    function(event){

        if(event.key === "ArrowLeft"){
            window.leftKey = false;
        }

        if(event.key === "ArrowRight"){
            window.rightKey = false;
        }
    }
);


/* СВАЙП ПО ЭКРАНУ */

let touchActive = false;

document.addEventListener(
    "touchstart",
    function(event){

        if(!playing){
            return;
        }

        touchActive = true;

        const touch =
            event.touches[0];

        window.targetX =
            touch.clientX -
            (player.offsetWidth / 2);

    },
    {passive:false}
);

document.addEventListener(
    "touchmove",
    function(event){

        if(!playing || !touchActive){
            return;
        }

        const touch =
            event.touches[0];

        window.targetX =
            touch.clientX -
            (player.offsetWidth / 2);

        event.preventDefault();

    },
    {passive:false}
);

document.addEventListener(
    "touchend",
    function(){

        touchActive = false;

    }
);


/* МЫШЬ */

document.addEventListener(
    "mousemove",
    function(event){

        if(!playing){
            return;
        }

        window.targetX =
            event.clientX -
            (player.offsetWidth / 2);
    }
);


/* ПРИ ПОВОРОТЕ ЭКРАНА */

window.addEventListener(
    "resize",
    function(){

        if(!playing){
            return;
        }

        const width =
            player.offsetWidth || 76;

        playerX =
            Math.max(
                5,
                Math.min(
                    window.innerWidth-width-5,
                    playerX
                )
            );
    }
);


/* НАЧАЛЬНОЕ СОСТОЯНИЕ */

updateRecord();

</script></body>
</html>
