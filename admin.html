<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GYURZA — Admin</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#05080c;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.wrap{
    width:min(900px,100%);
    margin:auto;
}

h1{
    margin:20px 0 8px;
}

.sub{
    color:#81909d;
    margin-bottom:25px;
}

.panel{
    background:#0b1118;
    border:1px solid #18232e;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

input,
textarea,
select{
    width:100%;
    background:#070b10;
    color:white;
    border:1px solid #253442;
    border-radius:10px;
    padding:13px;
    margin:7px 0 12px;
    font:inherit;
}

textarea{
    min-height:150px;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:700;
}

.primary{
    background:#25baff;
    color:#001018;
}

.secondary{
    background:#17232e;
    color:white;
}

.danger{
    background:#d9364f;
    color:white;
}

button:disabled{
    opacity:.5;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#070b10;
    color:#9aaab7;
    line-height:1.5;
    word-break:break-word;
}

.success{
    color:#52dc91;
}

.error{
    color:#ff687d;
}

.item{
    background:#080e14;
    border:1px solid #1b2935;
    border-radius:14px;
    padding:16px;
    margin-top:12px;
}

.item-type{
    color:#25baff;
    font-size:11px;
    font-weight:bold;
}

.item-date{
    color:#61717f;
    font-size:11px;
    margin:7px 0;
}

.item-text{
    white-space:pre-wrap;
    color:#c7d0d8;
    line-height:1.6;
    margin-bottom:15px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

#app{
    display:none;
}
</style><!-- SUPABASE --><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><!-- LOGIN --><div id="login"><h1>Админ-панель</h1>

<div class="sub">
    GYURZA Official Website
</div>

<div class="panel">

    <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="username"
    >

    <input
        id="password"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
    >

    <button
        id="loginButton"
        class="primary"
        type="button"
    >
        Войти
    </button>

    <div
        id="loginStatus"
        class="status"
    >
        Проверка подключения...
    </div>

</div>

</div><!-- ADMIN --><div id="app"><h1>Админ-панель</h1>

<div class="sub">
    Управление новостями и конкурсами
</div>

<div
    id="userInfo"
    class="status"
></div>


<div class="panel">

    <h2 id="editorTitle">
        Новая публикация
    </h2>

    <select id="type">

        <option value="news">
            Новость
        </option>

        <option value="contest">
            Конкурс
        </option>

    </select>

    <textarea
        id="content"
        placeholder="Текст публикации..."
    ></textarea>

    <input
        id="editId"
        type="hidden"
    >

    <div class="actions">

        <button
            id="saveButton"
            class="primary"
            type="button"
        >
            Опубликовать
        </button>

        <button
            id="clearButton"
            class="secondary"
            type="button"
        >
            Очистить
        </button>

    </div>

    <div
        id="saveStatus"
        class="status"
    ></div>

</div>


<div class="panel">

    <h2>
        История публикаций
    </h2>

    <div id="history">
        Загрузка...
    </div>

</div>


<button
    id="logoutButton"
    class="secondary"
    type="button"
>
    Выйти
</button>

</div></div><script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://gcwjtsqnmfimqdoyhfar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Y-QSCei2FKGVHaoI3TG7ng_ldK08d0w";


/* =========================================
   CHECK SUPABASE LIBRARY
========================================= */

const loginStatus =
document.getElementById("loginStatus");


if(
    typeof window.supabase === "undefined"
){

    loginStatus.className =
    "status error";

    loginStatus.textContent =
    "ОШИБКА: библиотека Supabase не загрузилась. Проверь интернет-соединение.";

}else{

    loginStatus.className =
    "status success";

    loginStatus.textContent =
    "Supabase загружен. Подключение готово.";

}


/* =========================================
   CLIENT
========================================= */

let client = null;


try{

    if(
        typeof window.supabase !== "undefined"
    ){

        client =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    }

}catch(error){

    loginStatus.className =
    "status error";

    loginStatus.textContent =
    "Ошибка создания Supabase клиента: " +
    error.message;

}


/* =========================================
   LOGIN
========================================= */

const loginButton =
document.getElementById("loginButton");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBlock =
document.getElementById("login");

const appBlock =
document.getElementById("app");

const userInfo =
document.getElementById("userInfo");


loginButton.onclick =
async function(){

    const email =
    emailInput.value.trim();

    const password =
    passwordInput.value;


    if(!client){

        showLoginError(
            "Supabase клиент не создан."
        );

        return;

    }


    if(!email){

        showLoginError(
            "Введите email."
        );

        return;

    }


    if(!password){

        showLoginError(
            "Введите пароль."
        );

        return;

    }


    loginButton.disabled =
    true;

    loginButton.textContent =
    "Вход...";


    loginStatus.className =
    "status";

    loginStatus.textContent =
    "Отправляю данные в Supabase...";


    try{

        const result =
        await client.auth.signInWithPassword({

            email:email,

            password:password

        });


        console.log(
            "SUPABASE LOGIN RESULT:",
            result
        );


        if(result.error){

            showLoginError(
                "Supabase: " +
                result.error.message
            );

            return;

        }


        if(
            !result.data ||
            !result.data.session
        ){

            showLoginError(
                "Supabase не вернул сессию."
            );

            return;

        }


        loginStatus.className =
        "status success";

        loginStatus.textContent =
        "Вход выполнен!";


        loginBlock.style.display =
        "none";

        appBlock.style.display =
        "block";


        const user =
        result.data.user;


        if(user){

            userInfo.textContent =
            "Выполнен вход: " +
            user.email;

        }


        loadHistory();


    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        showLoginError(
            "JavaScript ошибка: " +
            error.message
        );

    }finally{

        loginButton.disabled =
        false;

        loginButton.textContent =
        "Войти";

    }

};


function showLoginError(message){

    loginStatus.className =
    "status error";

    loginStatus.textContent =
    message;

}


/* =========================================
   ENTER
========================================= */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            loginButton.click();

        }

    }
);


/* =========================================
   SAVE
========================================= */

const typeInput =
document.getElementById("type");

const contentInput =
document.getElementById("content");

const editIdInput =
document.getElementById("editId");

const saveButton =
document.getElementById("saveButton");

const saveStatus =
document.getElementById("saveStatus");

const editorTitle =
document.getElementById("editorTitle");

const clearButton =
document.getElementById("clearButton");

const editorPanel =
document.querySelector(".panel");


saveButton.onclick =
async function(){

    const text =
    contentInput.value.trim();

    const section =
    typeInput.value;

    const id =
    editIdInput.value;


    if(!text){

        saveStatus.className =
        "status error";

        saveStatus.textContent =
        "Введите текст.";

        return;

    }


    saveButton.disabled =
    true;


    try{

        let result;


        if(id){

            const numericId =
            Number(id);


            result =
            await client
            .from("site_content")
            .update({

                section:section,

                content:text,

                updated_at:
                new Date().toISOString()

            })
            .eq(
                "id",
                numericId
            )
            .select();


        }else{

            result =
            await client
            .from("site_content")
            .insert({

                section:section,

                content:text

            })
            .select();

        }


        if(result.error){

            throw result.error;

        }


        saveStatus.className =
        "status success";

        saveStatus.textContent =
        id
        ? "Изменено!"
        : "Опубликовано!";


        clearEditor();

        loadHistory();


    }catch(error){

        saveStatus.className =
        "status error";

        saveStatus.textContent =
        "Ошибка: " +
        error.message;

    }finally{

        saveButton.disabled =
        false;

        saveButton.textContent =
        editIdInput.value
        ? "Сохранить изменения"
        : "Опубликовать";

    }

};


/* =========================================
   HISTORY
========================================= */

const historyBlock =
document.getElementById("history");


async function loadHistory(){

    historyBlock.innerHTML =
    "Загрузка...";


    try{

        const result =
        await client
        .from("site_content")
        .select(
            "id,section,content,created_at,updated_at"
        )
        .in(
            "section",
            ["news","contest"]
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(result.error){

            throw result.error;

        }


        const posts =
        result.data || [];


        if(posts.length === 0){

            historyBlock.innerHTML =
            '<div class="status">Публикаций пока нет.</div>';

            return;

        }


        historyBlock.innerHTML =
        "";


        posts.forEach(
            function(post){

                const item =
                document.createElement(
                    "div"
                );

                item.className =
                "item";


                const type =
                document.createElement(
                    "div"
                );

                type.className =
                "item-type";

                type.textContent =
                post.section === "contest"
                ? "КОНКУРС"
                : "НОВОСТЬ";


                const date =
                document.createElement(
                    "div"
                );

                date.className =
                "item-date";

                date.textContent =
                formatDate(
                    post.updated_at ||
                    post.created_at
                );


                const text =
                document.createElement(
                    "div"
                );

                text.className =
                "item-text";

                text.textContent =
                post.content || "";


                const actions =
                document.createElement(
                    "div"
                );

                actions.className =
                "actions";


                const edit =
                document.createElement(
                    "button"
                );

                edit.className =
                "primary";

                edit.textContent =
                "Изменить";


                edit.onclick =
                function(){

                    startEdit(post);

                };


                const remove =
                document.createElement(
                    "button"
                );

                remove.className =
                "danger";

                remove.textContent =
                "Удалить";


                remove.onclick =
                function(){

                    deletePost(
                        post.id
                    );

                };


                actions.appendChild(edit);

                actions.appendChild(remove);


                item.appendChild(type);

                item.appendChild(date);

                item.appendChild(text);

                item.appendChild(actions);


                historyBlock.appendChild(item);

            }
        );


    }catch(error){

        historyBlock.innerHTML =
        '<div class="status error">' +
        "Ошибка: " +
        escapeHtml(
            error.message
        ) +
        "</div>";

    }

}


/* =========================================
   EDIT
========================================= */

function startEdit(post){

    if(
        post.id === null ||
        post.id === undefined
    ){

        alert(
            "У публикации нет ID."
        );

        return;

    }


    editIdInput.value =
    String(post.id);

    typeInput.value =
    post.section;

    contentInput.value =
    post.content || "";


    editorTitle.textContent =
    "Редактирование публикации";


    saveButton.textContent =
    "Сохранить изменения";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =========================================
   DELETE
========================================= */

async function deletePost(id){

    const numericId =
    Number(id);


    if(
        !Number.isInteger(numericId)
    ){

        alert(
            "Неверный ID публикации."
        );

        return;

    }


    if(
        !confirm(
            "Удалить публикацию?"
        )
    ){

        return;

    }


    try{

        const result =
        await client
        .from("site_content")
        .delete()
        .eq(
            "id",
            numericId
        )
        .select("id");


        if(result.error){

            throw result.error;

        }


        if(
            !result.data ||
            result.data.length === 0
        ){

            throw new Error(
                "Supabase не разрешил удаление. Проверь DELETE policy."
            );

        }


        if(
            editIdInput.value ===
            String(numericId)
        ){

            clearEditor();

        }


        loadHistory();


    }catch(error){

        alert(
            "Ошибка удаления: " +
            error.message
        );

    }

}


/* =========================================
   CLEAR
========================================= */

clearButton.onclick =
function(){

    clearEditor();

};


function clearEditor(){

    typeInput.value =
    "news";

    contentInput.value =
    "";

    editIdInput.value =
    "";

    editorTitle.textContent =
    "Новая публикация";

    saveButton.textContent =
    "Опубликовать";

}


/* =========================================
   LOGOUT
========================================= */

document
.getElementById("logoutButton")
.onclick =
async function(){

    await client.auth.signOut();

    location.reload();

};


/* =========================================
   SESSION
========================================= */

async function checkSession(){

    if(!client){
        return;
    }


    try{

        const result =
        await client.auth.getSession();


        if(
            result.data &&
            result.data.session
        ){

            loginBlock.style.display =
            "none";

            appBlock.style.display =
            "block";


            if(
                result.data.session.user
            ){

                userInfo.textContent =
                "Выполнен вход: " +
                result.data.session.user.email;

            }


            loadHistory();

        }

    }catch(error){

        console.error(
            error
        );

    }

}


/* =========================================
   DATE
========================================= */

function formatDate(date){

    if(!date){
        return "";
    }


    const d =
    new Date(date);


    if(
        Number.isNaN(
            d.getTime()
        )
    ){

        return "";
    }


    return d.toLocaleString(
        "ru-RU"
    );

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(text){

    return String(text || "")
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   START
========================================= */

checkSession();

</script></body>
</html>2
