<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GYURZA — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#05080c;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.wrap{
    width:min(1000px,100%);
    margin:auto;
}

h1{
    margin:20px 0 8px;
}

.sub{
    color:#81909d;
    margin-bottom:25px;
}

.panel{
    background:#0b1118;
    border:1px solid #18232e;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

input,textarea,select{
    width:100%;
    background:#070b10;
    color:white;
    border:1px solid #253442;
    border-radius:10px;
    padding:13px;
    margin:7px 0 12px;
    font:inherit;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    font-weight:700;
}

.primary{
    background:#25baff;
    color:#001018;
}

.danger{
    background:#d9364f;
    color:white;
}

.secondary{
    background:#17232e;
    color:white;
}

.hidden{
    display:none;
}

.status{
    margin-top:12px;
    color:#8da0ae;
}

.item{
    border:1px solid #1b2935;
    background:#080e14;
    border-radius:14px;
    padding:16px;
    margin-top:12px;
}

.item-type{
    color:#25baff;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
}

.item-date{
    color:#61717f;
    font-size:11px;
    margin:7px 0;
}

.item-text{
    white-space:pre-wrap;
    color:#c7d0d8;
    line-height:1.6;
    margin:10px 0 15px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

#app{
    display:none;
}

.error{
    color:#ff687d;
}

.success{
    color:#52dc91;
}
</style>
</head>

<body>

<div class="wrap">

    <div id="login">

        <h1>Админ-панель</h1>
        <div class="sub">GYURZA Official Website</div>

        <div class="panel">

            <input
                id="email"
                type="email"
                placeholder="Email"
            >

            <input
                id="password"
                type="password"
                placeholder="Пароль"
            >

            <button
                class="primary"
                onclick="login()"
            >
                Войти
            </button>

            <div id="loginStatus" class="status"></div>

        </div>

    </div>


    <div id="app">

        <h1>Админ-панель</h1>

        <div class="sub">
            Управление новостями и конкурсами
        </div>


        <!-- РЕДАКТОР -->

        <div class="panel">

            <h2 id="editorTitle">
                Новая публикация
            </h2>

            <br>

            <select id="type">

                <option value="news">
                    Новость
                </option>

                <option value="contest">
                    Конкурс
                </option>

            </select>


            <textarea
                id="content"
                placeholder="Текст публикации..."
            ></textarea>


            <input
                id="editId"
                type="hidden"
            >


            <div class="actions">

                <button
                    class="primary"
                    onclick="savePost()"
                >
                    Сохранить
                </button>

                <button
                    class="secondary"
                    onclick="clearEditor()"
                >
                    Очистить
                </button>

            </div>


            <div id="saveStatus" class="status"></div>

        </div>


        <!-- ИСТОРИЯ -->

        <div class="panel">

            <h2>
                История публикаций
            </h2>

            <br>

            <div id="history">
                Загрузка...
            </div>

        </div>


        <button
            class="secondary"
            onclick="logout()"
        >
            Выйти
        </button>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://gcwjtsqnmfimqdoyhfar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Y-QSCei2FKGVHaoI3TG7ng_ldK08d0w";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   АВТОРИЗАЦИЯ
========================= */

async function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const status =
        document.getElementById("loginStatus");


    status.textContent = "Вход...";


    const { error } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });


    if(error){

        status.className = "status error";

        status.textContent =
            "Ошибка: " + error.message;

        return;
    }


    status.className = "status success";

    status.textContent = "Успешно";


    showApp();

}


/* =========================
   ПРОВЕРКА СЕССИИ
========================= */

async function checkSession(){

    const { data } =
        await supabaseClient.auth.getSession();


    if(data.session){

        showApp();

    }

}


async function showApp(){

    document.getElementById("login").style.display =
        "none";

    document.getElementById("app").style.display =
        "block";

    await loadHistory();

}


/* =========================
   СОХРАНЕНИЕ
========================= */

async function savePost(){

    const type =
        document.getElementById("type").value;

    const content =
        document.getElementById("content").value.trim();

    const editId =
        document.getElementById("editId").value;

    const status =
        document.getElementById("saveStatus");


    if(!content){

        status.className = "status error";
        status.textContent =
            "Введите текст.";

        return;
    }


    status.className = "status";
    status.textContent = "Сохранение...";


    let result;


    if(editId){

        result =
            await supabaseClient
                .from("site_content")
                .update({
                    selection:type,
                    content:content,
                    updated_at:new Date().toISOString()
                })
                .eq("id",editId);

    }else{

        result =
            await supabaseClient
                .from("site_content")
                .insert({
                    selection:type,
                    content:content
                });

    }


    if(result.error){

        status.className = "status error";

        status.textContent =
            "Ошибка: " + result.error.message;

        return;
    }


    status.className = "status success";

    status.textContent =
        editId
        ? "Изменения сохранены!"
        : "Публикация добавлена!";


    clearEditor();

    await loadHistory();

}


/* =========================
   ИСТОРИЯ
========================= */

async function loadHistory(){

    const history =
        document.getElementById("history");


    history.textContent = "Загрузка...";


    const { data, error } =
        await supabaseClient
            .from("site_content")
            .select("*")
            .in("selection",["news","contest"])
            .order("created_at",{
                ascending:false
            });


    if(error){

        history.innerHTML =
            '<div class="error">' +
            "Ошибка: " +
            escapeHtml(error.message) +
            "</div>";

        return;
    }


    if(!data || data.length === 0){

        history.innerHTML =
            '<div class="sub">' +
            "Публикаций пока нет." +
            "</div>";

        return;
    }


    history.innerHTML =
        data.map(item => {

            const type =
                item.selection === "contest"
                ? "КОНКУРС"
                : "НОВОСТЬ";


            const date =
                item.updated_at ||
                item.created_at;


            return `

                <div class="item">

                    <div class="item-type">
                        ${type}
                    </div>

                    <div class="item-date">
                        ${formatDate(date)}
                    </div>

                    <div class="item-text">
                        ${escapeHtml(item.content)}
                    </div>

                    <div class="actions">

                        <button
                            class="primary"
                            onclick="editPost(${item.id})"
                        >
                            Изменить
                        </button>

                        <button
                            class="danger"
                            onclick="deletePost(${item.id})"
                        >
                            Удалить
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   РЕДАКТИРОВАНИЕ
========================= */

async function editPost(id){

    const { data, error } =
        await supabaseClient
            .from("site_content")
            .select("*")
            .eq("id",id)
            .single();


    if(error){

        alert(
            "Ошибка: " + error.message
        );

        return;
    }


    document.getElementById("type").value =
        data.selection;

    document.getElementById("content").value =
        data.content;

    document.getElementById("editId").value =
        data.id;

    document.getElementById("editorTitle").textContent =
        "Редактирование публикации";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   УДАЛЕНИЕ
========================= */

async function deletePost(id){

    const ok =
        confirm(
            "Удалить именно эту публикацию?"
        );


    if(!ok){
        return;
    }


    const { error } =
        await supabaseClient
            .from("site_content")
            .delete()
            .eq("id",id);


    if(error){

        alert(
            "Ошибка: " + error.message
        );

        return;
    }


    await loadHistory();

}


/* =========================
   ОЧИСТКА
========================= */

function clearEditor(){

    document.getElementById("content").value =
        "";

    document.getElementById("editId").value =
        "";

    document.getElementById("editorTitle").textContent =
        "Новая публикация";

}


/* =========================
   ВЫХОД
========================= */

async function logout(){

    await supabaseClient.auth.signOut();

    location.reload();

}


/* =========================
   ДАТА
========================= */

function formatDate(date){

    if(!date){
        return "";
    }

    return new Date(date).toLocaleString(
        "ru-RU"
    );

}


/* =========================
   БЕЗОПАСНЫЙ ТЕКСТ
========================= */

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


checkSession();

</script>

</body>
</html>
