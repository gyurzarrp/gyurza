<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GYURZA — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#05080c;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.wrap{
    width:min(1000px,100%);
    margin:auto;
}

h1{
    margin:20px 0 8px;
}

h2{
    margin-bottom:15px;
}

.sub{
    color:#81909d;
    margin-bottom:25px;
}

.panel{
    background:#0b1118;
    border:1px solid #18232e;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

input,
textarea,
select{
    width:100%;
    background:#070b10;
    color:white;
    border:1px solid #253442;
    border-radius:10px;
    padding:13px;
    margin:7px 0 12px;
    font:inherit;
}

textarea{
    min-height:170px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    font-weight:700;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.primary{
    background:#25baff;
    color:#001018;
}

.danger{
    background:#d9364f;
    color:white;
}

.secondary{
    background:#17232e;
    color:white;
}

.status{
    margin-top:12px;
    color:#8da0ae;
}

.error{
    color:#ff687d;
}

.success{
    color:#52dc91;
}

.item{
    border:1px solid #1b2935;
    background:#080e14;
    border-radius:14px;
    padding:16px;
    margin-top:12px;
}

.item-type{
    color:#25baff;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
}

.item-date{
    color:#61717f;
    font-size:11px;
    margin:7px 0;
}

.item-text{
    white-space:pre-wrap;
    color:#c7d0d8;
    line-height:1.6;
    margin:10px 0 15px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

#app{
    display:none;
}

.editing{
    border-color:#25baff;
}
</style></head><body><div class="wrap"><!-- LOGIN --><div id="login"><h1>Админ-панель</h1>

<div class="sub">
    GYURZA Official Website
</div>

<div class="panel">

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Пароль"
    >

    <button
        id="loginButton"
        class="primary"
    >
        Войти
    </button>

    <div
        id="loginStatus"
        class="status"
    ></div>

</div>

</div><!-- ADMIN --><div id="app"><h1>Админ-панель</h1>

<div class="sub">
    Управление новостями и конкурсами
</div>


<!-- EDITOR -->

<div
    class="panel"
    id="editorPanel"
>

    <h2 id="editorTitle">
        Новая публикация
    </h2>

    <select id="type">

        <option value="news">
            Новость
        </option>

        <option value="contest">
            Конкурс
        </option>

    </select>


    <textarea
        id="content"
        placeholder="Введите текст публикации..."
    ></textarea>


    <input
        id="editId"
        type="hidden"
    >


    <div class="actions">

        <button
            id="saveButton"
            class="primary"
        >
            Опубликовать
        </button>

        <button
            id="clearButton"
            class="secondary"
        >
            Очистить
        </button>

    </div>


    <div
        id="saveStatus"
        class="status"
    ></div>

</div>


<!-- HISTORY -->

<div class="panel">

    <h2>
        История публикаций
    </h2>

    <div id="history">
        Загрузка...
    </div>

</div>


<button
    id="logoutButton"
    class="secondary"
>
    Выйти
</button>

</div></div><script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://gcwjtsqnmfimqdoyhfar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Y-QSCei2FKGVHaoI3TG7ng_ldK08d0w";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   ELEMENTS
================================================== */

const login =
    document.getElementById("login");

const app =
    document.getElementById("app");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const loginStatus =
    document.getElementById("loginStatus");

const type =
    document.getElementById("type");

const content =
    document.getElementById("content");

const editId =
    document.getElementById("editId");

const saveButton =
    document.getElementById("saveButton");

const clearButton =
    document.getElementById("clearButton");

const saveStatus =
    document.getElementById("saveStatus");

const history =
    document.getElementById("history");

const editorTitle =
    document.getElementById("editorTitle");

const editorPanel =
    document.getElementById("editorPanel");

const logoutButton =
    document.getElementById("logoutButton");


/* ==================================================
   LOGIN
================================================== */

loginButton.onclick =
    async function(){

        const userEmail =
            email.value.trim();

        const userPassword =
            password.value;


        if(!userEmail || !userPassword){

            setStatus(
                loginStatus,
                "Введите email и пароль.",
                "error"
            );

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Вход...";


        const result =
            await supabaseClient.auth
                .signInWithPassword({

                    email:userEmail,
                    password:userPassword

                });


        loginButton.disabled = false;

        loginButton.textContent =
            "Войти";


        if(result.error){

            setStatus(
                loginStatus,
                "Ошибка: " +
                result.error.message,
                "error"
            );

            return;
        }


        await showApp();

    };


password.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            loginButton.click();
        }

    }
);


/* ==================================================
   SESSION
================================================== */

async function checkSession(){

    const result =
        await supabaseClient.auth.getSession();


    if(
        result.data &&
        result.data.session
    ){

        await showApp();

    }

}


async function showApp(){

    login.style.display =
        "none";

    app.style.display =
        "block";

    await loadHistory();

}


/* ==================================================
   SAVE
================================================== */

saveButton.onclick =
    async function(){

        const postType =
            type.value;

        const postContent =
            content.value.trim();

        const id =
            editId.value;


        if(!postContent){

            setStatus(
                saveStatus,
                "Введите текст публикации.",
                "error"
            );

            return;
        }


        saveButton.disabled = true;

        saveButton.textContent =
            id
            ? "Сохранение..."
            : "Публикация...";


        let result;


        if(id){

            result =
                await supabaseClient
                    .from("site_content")
                    .update({

                        selection:postType,

                        content:postContent,

                        updated_at:
                            new Date().toISOString()

                    })
                    .eq(
                        "id",
                        id
                    );

        }else{

            result =
                await supabaseClient
                    .from("site_content")
                    .insert({

                        selection:postType,

                        content:postContent

                    });

        }


        saveButton.disabled = false;


        if(result.error){

            saveButton.textContent =
                id
                ? "Сохранить изменения"
                : "Опубликовать";


            setStatus(
                saveStatus,
                "Ошибка: " +
                result.error.message,
                "error"
            );

            return;
        }


        setStatus(
            saveStatus,
            id
            ? "Изменения сохранены!"
            : "Публикация добавлена!",
            "success"
        );


        clearEditor();

        await loadHistory();

    };


/* ==================================================
   HISTORY
================================================== */

async function loadHistory(){

    history.innerHTML =
        '<div class="status">Загрузка...</div>';


    const result =
        await supabaseClient
            .from("site_content")
            .select(
                "id, selection, content, created_at, updated_at"
            )
            .in(
                "selection",
                [
                    "news",
                    "contest"
                ]
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(result.error){

        history.innerHTML =
            '<div class="error">' +
            'Ошибка: ' +
            escapeHtml(
                result.error.message
            ) +
            '</div>';

        return;
    }


    const data =
        result.data;


    if(
        !data ||
        data.length === 0
    ){

        history.innerHTML =
            '<div class="status">' +
            'Публикаций пока нет.' +
            '</div>';

        return;
    }


    history.innerHTML =
        data.map(
            function(item){

                const itemType =
                    item.selection === "contest"
                    ? "КОНКУРС"
                    : "НОВОСТЬ";


                const date =
                    item.updated_at ||
                    item.created_at;


                return `

                    <div class="item">

                        <div class="item-type">
                            ${itemType}
                        </div>

                        <div class="item-date">
                            ${formatDate(date)}
                        </div>

                        <div class="item-text">
                            ${escapeHtml(item.content)}
                        </div>

                        <div class="actions">

                            <button
                                class="primary"
                                onclick="editPost(${item.id})"
                            >
                                Изменить
                            </button>

                            <button
                                class="danger"
                                onclick="deletePost(${item.id})"
                            >
                                Удалить
                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* ==================================================
   EDIT
================================================== */

async function editPost(id){

    const result =
        await supabaseClient
            .from("site_content")
            .select(
                "id, selection, content"
            )
            .eq(
                "id",
                id
            )
            .single();


    if(result.error){

        alert(
            "Ошибка: " +
            result.error.message
        );

        return;
    }


    type.value =
        result.data.selection;

    content.value =
        result.data.content;

    editId.value =
        result.data.id;


    editorTitle.textContent =
        "Редактирование публикации";


    saveButton.textContent =
        "Сохранить изменения";


    editorPanel.classList.add(
        "editing"
    );


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* ==================================================
   DELETE
================================================== */

async function deletePost(id){

    if(
        !confirm(
            "Удалить именно эту публикацию?"
        )
    ){

        return;

    }


    const result =
        await supabaseClient
            .from("site_content")
            .delete()
            .eq(
                "id",
                id
            );


    if(result.error){

        alert(
            "Ошибка удаления: " +
            result.error.message
        );

        return;
    }


    if(
        editId.value === String(id)
    ){

        clearEditor();

    }


    await loadHistory();

}


/* ==================================================
   CLEAR
================================================== */

clearButton.onclick =
    clearEditor;


function clearEditor(){

    type.value =
        "news";

    content.value =
        "";

    editId.value =
        "";


    editorTitle.textContent =
        "Новая публикация";


    saveButton.textContent =
        "Опубликовать";


    editorPanel.classList.remove(
        "editing"
    );


    saveStatus.textContent =
        "";

}


/* ==================================================
   LOGOUT
================================================== */

logoutButton.onclick =
    async function(){

        await supabaseClient.auth.signOut();

        location.reload();

    };


/* ==================================================
   STATUS
================================================== */

function setStatus(
    element,
    text,
    className
){

    element.textContent =
        text;

    element.className =
        "status";


    if(className){

        element.classList.add(
            className
        );

    }

}


/* ==================================================
   DATE
================================================== */

function formatDate(date){

    if(!date){
        return "";
    }


    const d =
        new Date(date);


    if(isNaN(d.getTime())){
        return "";
    }


    return d.toLocaleString(
        "ru-RU"
    );

}


/* ==================================================
   ESCAPE
================================================== */

function escapeHtml(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==================================================
   START
================================================== */

checkSession();

</script></body>
</html>
