<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GYURZA — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#05080c;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.wrap{
    width:min(1000px,100%);
    margin:auto;
}

h1{
    margin:20px 0 8px;
}

h2{
    margin-bottom:15px;
}

.sub{
    color:#81909d;
    margin-bottom:25px;
}

.panel{
    background:#0b1118;
    border:1px solid #18232e;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

input,
textarea,
select{
    width:100%;
    background:#070b10;
    color:white;
    border:1px solid #253442;
    border-radius:10px;
    padding:13px;
    margin:7px 0 12px;
    font:inherit;
}

textarea{
    min-height:170px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    font-weight:700;
}

.primary{
    background:#25baff;
    color:#001018;
}

.danger{
    background:#d9364f;
    color:white;
}

.secondary{
    background:#17232e;
    color:white;
}

.hidden{
    display:none;
}

.status{
    margin-top:12px;
    color:#8da0ae;
}

.error{
    color:#ff687d;
}

.success{
    color:#52dc91;
}

.item{
    border:1px solid #1b2935;
    background:#080e14;
    border-radius:14px;
    padding:16px;
    margin-top:12px;
}

.item-type{
    color:#25baff;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
}

.item-date{
    color:#61717f;
    font-size:11px;
    margin:7px 0;
}

.item-text{
    white-space:pre-wrap;
    color:#c7d0d8;
    line-height:1.6;
    margin:10px 0 15px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

#app{
    display:none;
}

.logout{
    margin-top:5px;
}

.editing{
    border-color:#25baff;
}

.badge{
    display:inline-block;
    color:#25baff;
    background:rgba(37,186,255,.1);
    border:1px solid rgba(37,186,255,.25);
    padding:6px 10px;
    border-radius:20px;
    font-size:10px;
    font-weight:bold;
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="wrap">


<!-- ================= LOGIN ================= -->

<div id="login">

    <h1>Админ-панель</h1>

    <div class="sub">
        GYURZA Official Website
    </div>

    <div class="panel">

        <input
            id="email"
            type="email"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            autocomplete="current-password"
        >

        <button
            class="primary"
            id="loginButton"
        >
            Войти
        </button>

        <div
            id="loginStatus"
            class="status"
        ></div>

    </div>

</div>


<!-- ================= APP ================= -->

<div id="app">

    <h1>Админ-панель</h1>

    <div class="sub">
        Управление новостями и конкурсами
    </div>


    <!-- РЕДАКТОР -->

    <div
        class="panel"
        id="editorPanel"
    >

        <div
            id="editingBadge"
            class="badge hidden"
        >
            РЕДАКТИРОВАНИЕ
        </div>

        <h2 id="editorTitle">
            Новая публикация
        </h2>

        <select id="type">

            <option value="news">
                Новость
            </option>

            <option value="contest">
                Конкурс
            </option>

        </select>

        <textarea
            id="content"
            placeholder="Введите текст публикации..."
        ></textarea>

        <input
            id="editId"
            type="hidden"
        >

        <div class="actions">

            <button
                class="primary"
                id="saveButton"
            >
                Опубликовать
            </button>

            <button
                class="secondary"
                id="clearButton"
            >
                Очистить
            </button>

        </div>

        <div
            id="saveStatus"
            class="status"
        ></div>

    </div>


    <!-- ИСТОРИЯ -->

    <div class="panel">

        <h2>
            История публикаций
        </h2>

        <div
            id="history"
        >
            Загрузка...
        </div>

    </div>


    <button
        class="secondary logout"
        id="logoutButton"
    >
        Выйти
    </button>

</div>

</div>


<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
    "https://gcwjtsqnmfimqdoyhfar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Y-QSCei2FKGVHaoI3TG7ng_ldK08d0w";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==================================================
   ЭЛЕМЕНТЫ
================================================== */

const loginBlock =
    document.getElementById("login");

const appBlock =
    document.getElementById("app");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const loginStatus =
    document.getElementById("loginStatus");

const typeInput =
    document.getElementById("type");

const contentInput =
    document.getElementById("content");

const editIdInput =
    document.getElementById("editId");

const saveButton =
    document.getElementById("saveButton");

const clearButton =
    document.getElementById("clearButton");

const saveStatus =
    document.getElementById("saveStatus");

const historyBlock =
    document.getElementById("history");

const editorTitle =
    document.getElementById("editorTitle");

const editingBadge =
    document.getElementById("editingBadge");

const editorPanel =
    document.getElementById("editorPanel");

const logoutButton =
    document.getElementById("logoutButton");


/* ==================================================
   LOGIN
================================================== */

loginButton.addEventListener(
    "click",
    login
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            login();
        }

    }
);


async function login(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        showStatus(
            loginStatus,
            "Введите email и пароль.",
            "error"
        );

        return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
        "Вход...";


    showStatus(
        loginStatus,
        "Проверка данных...",
        ""
    );


    const { error } =
        await supabaseClient.auth.signInWithPassword({

            email:email,
            password:password

        });


    loginButton.disabled = false;

    loginButton.textContent =
        "Войти";


    if(error){

        showStatus(
            loginStatus,
            "Ошибка входа: " +
            error.message,
            "error"
        );

        return;
    }


    showStatus(
        loginStatus,
        "Успешный вход.",
        "success"
    );


    await showApp();

}


/* ==================================================
   ПРОВЕРКА СЕССИИ
================================================== */

async function checkSession(){

    const { data } =
        await supabaseClient.auth.getSession();


    if(data && data.session){

        await showApp();

    }

}


/* ==================================================
   ПОКАЗ АДМИНКИ
================================================== */

async function showApp(){

    loginBlock.style.display =
        "none";

    appBlock.style.display =
        "block";


    await loadHistory();

}


/* ==================================================
   СОХРАНЕНИЕ
================================================== */

saveButton.addEventListener(
    "click",
    savePost
);


async function savePost(){

    const type =
        typeInput.value;

    const content =
        contentInput.value.trim();

    const editId =
        editIdInput.value;


    if(!content){

        showStatus(
            saveStatus,
            "Введите текст публикации.",
            "error"
        );

        return;
    }


    saveButton.disabled = true;

    saveButton.textContent =
        editId
        ? "Сохранение..."
        : "Публикация...";


    showStatus(
        saveStatus,
        "Сохранение...",
        ""
    );


    let result;


    /* =========================
       РЕДАКТИРОВАНИЕ
    ========================= */

    if(editId){

        result =
            await supabaseClient
                .from("site_content")
                .update({

                    selection:type,

                    content:content

                })
                .eq(
                    "id",
                    editId
                );

    }


    /* =========================
       НОВАЯ ПУБЛИКАЦИЯ
    ========================= */

    else{

        result =
            await supabaseClient
                .from("site_content")
                .insert({

                    selection:type,

                    content:content

                });

    }


    saveButton.disabled = false;


    if(result.error){

        saveButton.textContent =
            editId
            ? "Сохранить изменения"
            : "Опубликовать";


        showStatus(
            saveStatus,
            "Ошибка: " +
            result.error.message,
            "error"
        );

        return;
    }


    showStatus(
        saveStatus,
        editId
        ? "Изменения сохранены!"
        : "Публикация добавлена!",
        "success"
    );


    clearEditor();

    await loadHistory();

}


/* ==================================================
   ИСТОРИЯ
================================================== */

async function loadHistory(){

    historyBlock.innerHTML =
        '<div class="status">Загрузка...</div>';


    const { data, error } =
        await supabaseClient
            .from("site_content")
            .select("*")
            .in(
                "selection",
                [
                    "news",
                    "contest"
                ]
            )
            .order(
                "id",
                {
                    ascending:false
                }
            );


    if(error){

        historyBlock.innerHTML =
            '<div class="error">' +
            'Ошибка загрузки: ' +
            escapeHtml(error.message) +
            '</div>';

        return;
    }


    if(!data || data.length === 0){

        historyBlock.innerHTML =
            '<div class="status">' +
            'Публикаций пока нет.' +
            '</div>';

        return;
    }


    historyBlock.innerHTML =
        data.map(
            function(item){

                const type =
                    item.selection === "contest"
                    ? "КОНКУРС"
                    : "НОВОСТЬ";


                const date =
                    item.updated_at ||
                    item.created_at;


                return `

                    <div class="item">

                        <div class="item-type">
                            ${type}
                        </div>

                        <div class="item-date">
                            ${formatDate(date)}
                        </div>

                        <div class="item-text">
                            ${escapeHtml(item.content)}
                        </div>

                        <div class="actions">

                            <button
                                class="primary"
                                onclick="editPost(${item.id})"
                            >
                                Изменить
                            </button>

                            <button
                                class="danger"
                                onclick="deletePost(${item.id})"
                            >
                                Удалить
                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* ==================================================
   РЕДАКТИРОВАНИЕ
================================================== */

async function editPost(id){

    const { data, error } =
        await supabaseClient
            .from("site_content")
            .select("*")
            .eq(
                "id",
                id
            )
            .single();


    if(error){

        alert(
            "Ошибка загрузки публикации: " +
            error.message
        );

        return;
    }


    typeInput.value =
        data.selection;

    contentInput.value =
        data.content;

    editIdInput.value =
        data.id;


    editorTitle.textContent =
        "Редактирование публикации";


    editingBadge.classList.remove(
        "hidden"
    );


    saveButton.textContent =
        "Сохранить изменения";


    editorPanel.classList.add(
        "editing"
    );


    saveStatus.textContent =
        "";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* ==================================================
   УДАЛЕНИЕ
================================================== */

async function deletePost(id){

    const ok =
        confirm(
            "Точно удалить эту публикацию?"
        );


    if(!ok){
        return;
    }


    const { error } =
        await supabaseClient
            .from("site_content")
            .delete()
            .eq(
                "id",
                id
            );


    if(error){

        alert(
            "Ошибка удаления: " +
            error.message
        );

        return;
    }


    await loadHistory();


    showStatus(
        saveStatus,
        "Публикация удалена.",
        "success"
    );

}


/* ==================================================
   ОЧИСТКА РЕДАКТОРА
================================================== */

clearButton.addEventListener(
    "click",
    clearEditor
);


function clearEditor(){

    typeInput.value =
        "news";

    contentInput.value =
        "";

    editIdInput.value =
        "";


    editorTitle.textContent =
        "Новая публикация";


    editingBadge.classList.add(
        "hidden"
    );


    editorPanel.classList.remove(
        "editing"
    );


    saveButton.textContent =
        "Опубликовать";


    saveStatus.textContent =
        "";

}


/* ==================================================
   ВЫХОД
================================================== */

logoutButton.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        location.reload();

    }
);


/* ==================================================
   СТАТУС
================================================== */

function showStatus(
    element,
    text,
    type
){

    element.textContent =
        text;


    element.className =
        "status";


    if(type){

        element.classList.add(
            type
        );

    }

}


/* ==================================================
   ДАТА
================================================== */

function formatDate(date){

    if(!date){
        return "";
    }


    const d =
        new Date(date);


    if(isNaN(d.getTime())){
        return "";
    }


    return d.toLocaleString(
        "ru-RU"
    );

}


/* ==================================================
   БЕЗОПАСНЫЙ HTML
================================================== */

function escapeHtml(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==================================================
   СТАРТ
================================================== */

checkSession();

</script>

</body>
</html>
