/* =================================================
   SUPABASE
================================================= */

const SUPABASE_URL =
    "https://gcwjtsqnmfimqdoyhfar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Y-QSCei2FKGVHaoI3TG7ng_ldK08d0w";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =================================================
   ЭЛЕМЕНТЫ
================================================= */

const loginBlock =
    document.getElementById("login");

const appBlock =
    document.getElementById("app");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const loginStatus =
    document.getElementById("loginStatus");

const typeInput =
    document.getElementById("type");

const contentInput =
    document.getElementById("content");

const editIdInput =
    document.getElementById("editId");

const saveButton =
    document.getElementById("saveButton");

const clearButton =
    document.getElementById("clearButton");

const saveStatus =
    document.getElementById("saveStatus");

const historyBlock =
    document.getElementById("history");

const editorTitle =
    document.getElementById("editorTitle");

const editorPanel =
    document.getElementById("editorPanel");

const logoutButton =
    document.getElementById("logoutButton");


/* =================================================
   ВХОД
================================================= */

loginButton.onclick = async function(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    if(!email || !password){

        setStatus(
            loginStatus,
            "Введите email и пароль.",
            "error"
        );

        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Вход...";

    const result =
        await supabaseClient.auth
            .signInWithPassword({
                email: email,
                password: password
            });

    loginButton.disabled = false;
    loginButton.textContent = "Войти";

    if(result.error){

        setStatus(
            loginStatus,
            "Ошибка: " + result.error.message,
            "error"
        );

        return;
    }

    setStatus(
        loginStatus,
        "Успешный вход!",
        "success"
    );

    await showApp();

};


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            loginButton.click();
        }

    }
);


/* =================================================
   СЕССИЯ
================================================= */

async function checkSession(){

    const result =
        await supabaseClient.auth.getSession();

    if(
        result.data &&
        result.data.session
    ){

        await showApp();

    }

}


async function showApp(){

    loginBlock.style.display = "none";
    appBlock.style.display = "block";

    await loadHistory();

}


/* =================================================
   СОХРАНЕНИЕ
================================================= */

saveButton.onclick = async function(){

    const postType =
        typeInput.value;

    const postContent =
        contentInput.value.trim();

    const id =
        editIdInput.value.trim();


    if(!postContent){

        setStatus(
            saveStatus,
            "Введите текст публикации.",
            "error"
        );

        return;
    }


    if(id === "null" || id === "undefined"){

        setStatus(
            saveStatus,
            "Ошибка: у публикации отсутствует ID.",
            "error"
        );

        return;
    }


    saveButton.disabled = true;

    saveButton.textContent =
        id
        ? "Сохранение..."
        : "Публикация...";


    let result;


    /* =========================
       РЕДАКТИРОВАНИЕ
    ========================= */

    if(id){

        result =
            await supabaseClient
                .from("site_content")
                .update({
                    section: postType,
                    content: postContent,
                    updated_at:
                        new Date().toISOString()
                })
                .eq(
                    "id",
                    id
                )
                .select("id");


    /* =========================
       НОВАЯ ПУБЛИКАЦИЯ
    ========================= */

    }else{

        result =
            await supabaseClient
                .from("site_content")
                .insert({
                    section: postType,
                    content: postContent
                })
                .select("id");

    }


    saveButton.disabled = false;


    if(result.error){

        saveButton.textContent =
            id
            ? "Сохранить изменения"
            : "Опубликовать";

        setStatus(
            saveStatus,
            "Ошибка: " + result.error.message,
            "error"
        );

        return;
    }


    /* UPDATE ничего не изменил */

    if(
        id &&
        (!result.data || result.data.length === 0)
    ){

        saveButton.textContent =
            "Сохранить изменения";

        setStatus(
            saveStatus,
            "Запись не изменена. Supabase не вернул изменённую строку.",
            "error"
        );

        return;
    }


    setStatus(
        saveStatus,
        id
        ? "Изменения сохранены!"
        : "Публикация добавлена!",
        "success"
    );


    clearEditor();

    await loadHistory();

};


/* =================================================
   ЗАГРУЗКА ИСТОРИИ
================================================= */

async function loadHistory(){

    historyBlock.innerHTML =
        '<div class="status">Загрузка...</div>';


    const result =
        await supabaseClient
            .from("site_content")
            .select(
                "id, section, content, created_at, updated_at"
            )
            .in(
                "section",
                [
                    "news",
                    "contest"
                ]
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(result.error){

        historyBlock.innerHTML =
            '<div class="error">' +
            "Ошибка: " +
            escapeHtml(
                result.error.message
            ) +
            "</div>";

        return;
    }


    const data =
        result.data || [];


    if(data.length === 0){

        historyBlock.innerHTML =
            '<div class="empty">' +
            "Публикаций пока нет." +
            "</div>";

        return;
    }


    historyBlock.innerHTML =
        data.map(
            function(item){

                const itemType =
                    item.section === "contest"
                    ? "КОНКУРС"
                    : "НОВОСТЬ";


                const date =
                    item.updated_at ||
                    item.created_at;


                /*
                 * ID специально сохраняем
                 * в data-id.
                 *
                 * Никаких onclick с item.id.
                 */

                const safeId =
                    item.id !== null &&
                    item.id !== undefined
                    ? String(item.id)
                    : "";


                return `

                    <div
                        class="item"
                        data-id="${escapeHtml(safeId)}"
                    >

                        <div class="item-type">
                            ${itemType}
                        </div>

                        <div class="item-date">
                            ${formatDate(date)}
                        </div>

                        <div class="item-text">
                            ${escapeHtml(item.content)}
                        </div>

                        <div class="actions">

                            <button
                                class="primary edit-button"
                                type="button"
                            >
                                Изменить
                            </button>

                            <button
                                class="danger delete-button"
                                type="button"
                            >
                                Удалить
                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");


    /* =========================
       КНОПКИ ИЗМЕНЕНИЯ
    ========================= */

    historyBlock
        .querySelectorAll(".edit-button")
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    function(){

                        const item =
                            button.closest(".item");

                        if(!item){

                            alert(
                                "Не удалось найти публикацию."
                            );

                            return;
                        }


                        const id =
                            item.dataset.id;


                        if(
                            !id ||
                            id === "null" ||
                            id === "undefined"
                        ){

                            alert(
                                "Ошибка: у этой публикации нет ID."
                            );

                            return;
                        }


                        editPost(id);

                    }
                );

            }
        );


    /* =========================
       КНОПКИ УДАЛЕНИЯ
    ========================= */

    historyBlock
        .querySelectorAll(".delete-button")
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    function(){

                        const item =
                            button.closest(".item");

                        if(!item){

                            alert(
                                "Не удалось найти публикацию."
                            );

                            return;
                        }


                        const id =
                            item.dataset.id;


                        if(
                            !id ||
                            id === "null" ||
                            id === "undefined"
                        ){

                            alert(
                                "Ошибка: у этой публикации нет ID."
                            );

                            return;
                        }


                        deletePost(id);

                    }
                );

            }
        );

}


/* =================================================
   РЕДАКТИРОВАНИЕ
================================================= */

async function editPost(id){

    if(
        id === null ||
        id === undefined ||
        id === "" ||
        id === "null" ||
        id === "undefined"
    ){

        alert(
            "Ошибка: отсутствует ID публикации."
        );

        return;
    }


    const result =
        await supabaseClient
            .from("site_content")
            .select(
                "id, section, content"
            )
            .eq(
                "id",
                id
            )
            .single();


    if(result.error){

        alert(
            "Ошибка загрузки публикации: " +
            result.error.message
        );

        return;
    }


    if(
        !result.data ||
        result.data.id === null ||
        result.data.id === undefined
    ){

        alert(
            "Ошибка: Supabase не вернул ID публикации."
        );

        return;
    }


    typeInput.value =
        result.data.section;

    contentInput.value =
        result.data.content;

    editIdInput.value =
        String(result.data.id);


    editorTitle.textContent =
        "Редактирование публикации";


    saveButton.textContent =
        "Сохранить изменения";


    editorPanel.classList.add(
        "editing"
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =================================================
   УДАЛЕНИЕ
================================================= */

async function deletePost(id){

    if(
        id === null ||
        id === undefined ||
        id === "" ||
        id === "null" ||
        id === "undefined"
    ){

        alert(
            "Ошибка: отсутствует ID публикации."
        );

        return;
    }


    const confirmed =
        confirm(
            "Удалить эту публикацию?"
        );


    if(!confirmed){
        return;
    }


    /*
     * Сначала получаем запись,
     * чтобы убедиться, что ID существует.
     */

    const check =
        await supabaseClient
            .from("site_content")
            .select("id")
            .eq("id", id)
            .maybeSingle();


    if(check.error){

        alert(
            "Ошибка проверки публикации: " +
            check.error.message
        );

        return;
    }


    if(!check.data){

        alert(
            "Публикация с ID " +
            id +
            " не найдена."
        );

        await loadHistory();

        return;
    }


    /* =========================
       УДАЛЕНИЕ
    ========================= */

    const result =
        await supabaseClient
            .from("site_content")
            .delete()
            .eq(
                "id",
                id
            )
            .select("id");


    if(result.error){

        alert(
            "Ошибка удаления: " +
            result.error.message
        );

        return;
    }


    if(
        !result.data ||
        result.data.length === 0
    ){

        alert(
            "Supabase не удалил запись. " +
            "Проверьте права DELETE для site_content."
        );

        return;
    }


    if(
        editIdInput.value ===
        String(id)
    ){

        clearEditor();

    }


    await loadHistory();

}


/* =================================================
   ОЧИСТКА
================================================= */

clearButton.onclick =
    clearEditor;


function clearEditor(){

    typeInput.value =
        "news";

    contentInput.value =
        "";

    editIdInput.value =
        "";


    editorTitle.textContent =
        "Новая публикация";


    saveButton.textContent =
        "Опубликовать";


    editorPanel.classList.remove(
        "editing"
    );


    saveStatus.textContent =
        "";

}


/* =================================================
   ВЫХОД
================================================= */

logoutButton.onclick =
    async function(){

        await supabaseClient.auth.signOut();

        location.reload();

    };


/* =================================================
   СТАТУС
================================================= */

function setStatus(
    element,
    text,
    type
){

    element.textContent =
        text;

    element.className =
        "status";


    if(type){

        element.classList.add(
            type
        );

    }

}


/* =================================================
   ДАТА
================================================= */

function formatDate(date){

    if(!date){
        return "";
    }


    const d =
        new Date(date);


    if(isNaN(d.getTime())){
        return "";
    }


    return d.toLocaleString(
        "ru-RU"
    );

}


/* =================================================
   БЕЗОПАСНЫЙ ТЕКСТ
============================================
