/* =================================================
   ELEMENTS
================================================= */

const loginBlock =

const appBlock =
    document.getElementById("app");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const userEmail =

const typeInput =
    document.getElementById("type");

const contentInput =
    document.getElementById("content");

const editIdInput =
    document.getElementById("editId");

const saveButton =

const clearButton =

const saveStatus =

/* =================================================
   LOGIN
================================================= */

loginButton.addEventListener(
    "click",
    login
);


passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


async function login(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email){

        setStatus(
            loginStatus,
            "Введите email.",
            "error"
        );

        return;
    }


    if(!password){

        setStatus(
            loginStatus,
            "Введите пароль.",
            "error"
        );

        return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
        "Вход...";


    const {
        data,
        error
    } =
        await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


    loginButton.disabled = false;

    loginButton.textContent =
        "Войти";


    if(error){

        setStatus(
            loginStatus,
            "Ошибка входа: " +
            error.message,
            "error"
        );

        return;
    }


    if(!data || !data.session){

        setStatus(
            loginStatus,
            "Не удалось создать сессию.",
            "error"
        );

        return;
    }


    await showApp();

}



/* =================================================
   SESSION
================================================= */

async function checkSession(){

    const {
        data,
        error
    } =
        await supabaseClient.auth
            .getSession();


    if(error){

        console.error(error);

        return;

    }


    if(
        data &&
        data.session
    ){

        await showApp();

    }

}


async function showApp(){

    loginBlock.style.display =
        "none";

    appBlock.style.display =
        "block";


    const {
        data
    } =
        await supabaseClient.auth
            .getUser();


    if(
        data &&
        data.user
    ){

        userEmail.textContent =
            "Вы вошли как: " +
            data.user.email;

    }


    await loadHistory();

}



/* =================================================
   SAVE / UPDATE
================================================= */

saveButton.addEventListener(
    "click",
    savePost
);


async function savePost(){

    const section =
        typeInput.value;

    const content =
        contentInput.value.trim();

    const id =
        editIdInput.value.trim();


    if(!content){

        setStatus(
            saveStatus,
            "Введите текст публикации.",
            "error"
        );

        return;
    }


    saveButton.disabled = true;


    if(id){

        saveButton.textContent =
            "Сохранение...";

    }else{

        saveButton.textContent =
            "Публикация...";

    }


    let result;


    /* =========================
       UPDATE
    ========================= */

    if(id){

        const numericId =
            Number(id);


        if(
            !Number.isInteger(numericId)
        ){

            setStatus(
                saveStatus,
                "Ошибка: неправильный ID публикации.",
                "error"
            );

            resetSaveButton();

            return;
        }


        result =
            await supabaseClient
                .from("site_content")
                .update({

                    section:section,

                    content:content,

                    updated_at:
                        new Date().toISOString()

                })
                .eq(
                    "id",
                    numericId
                )
                .select(
                    "id, section, content, created_at, updated_at"
                );


        if(result.error){

            setStatus(
                saveStatus,
                "Ошибка изменения: " +
                result.error.message,
                "error"
            );

            resetSaveButton();

            return;
        }


        if(
            !result.data ||
            result.data.length === 0
        ){

            setStatus(
                saveStatus,
                "Изменение не выполнено. Supabase не разрешил UPDATE или запись не найдена.",
                "error"
            );

            resetSaveButton();

            return;
        }


        setStatus(
            saveStatus,
            "Публикация успешно изменена!",
            "success"
        );

    }


    /* =========================
       INSERT
    ========================= */

    else{

        result =
            await supabaseClient
                .from("site_content")
                .insert({

                    section:section,

                    content:content

                })
                .select(
                    "id, section, content, created_at, updated_at"
                );


        if(result.error){

            setStatus(
                saveStatus,
                "Ошибка публикации: " +
                result.error.message,
                "error"
            );

            resetSaveButton();

            return;
        }


        if(
            !result.data ||
            result.data.length === 0
        ){

            setStatus(
                saveStatus,
                "Публикация не была добавлена.",
                "error"
            );

            resetSaveButton();

            return;
        }


        setStatus(
            saveStatus,
            "Публикация успешно добавлена!",
            "success"
        );

    }


    clearEditor();

    await loadHistory();

}



/* =================================================
   HISTORY
================================================= */

async function loadHistory(){

    historyBlock.innerHTML =
        '<div class="status">Загрузка...</div>';


    const result =
        await supabaseClient
            .from("site_content")
            .select(
                "id, section, content, created_at, updated_at"
            )
            .in(
                "section",
                [
                    "news",
                    "contest"
                ]
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(result.error){

        historyBlock.innerHTML =
            '<div class="error">' +
            "Ошибка загрузки: " +
            escapeHtml(
                result.error.message
            ) +
            "</div>";

        return;
    }


    const posts =
        result.data || [];


    if(posts.length === 0){

        historyBlock.innerHTML =
            '<div class="empty">' +
            "Публикаций пока нет." +
            "</div>";

        return;
    }


    historyBlock.innerHTML =
        "";


    posts.forEach(
        function(post){

            const item =
                document.createElement("div");

            item.className =
                "item";


            const type =
                document.createElement("div");

            type.className =
                "item-type";

            type.textContent =
                post.section === "contest"
                ? "КОНКУРС"
                : "НОВОСТЬ";


            const date =
                document.createElement("div");

            date.className =
                "item-date";

            date.textContent =
                formatDate(
                    post.updated_at ||
                    post.created_at
                );


            const text =
                document.createElement("div");

            text.className =
                "item-text";

            text.textContent =
                post.content || "";


            const actions =
                document.createElement("div");

            actions.className =
                "actions";


            const editButton =
                document.createElement("button");

            editButton.className =
                "primary";

            editButton.type =
                "button";

            editButton.textContent =
                "Изменить";


            editButton.addEventListener(
                "click",
                function(){

                    editPost(post);

                }
            );


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "danger";

            deleteButton.type =
                "button";

            deleteButton.textContent =
                "Удалить";


            deleteButton.addEventListener(
                "click",
                function(){

                    deletePost(post.id);

                }
            );


            actions.appendChild(
                editButton
            );

            actions.appendChild(
                deleteButton
            );


            item.appendChild(type);

            item.appendChild(date);

            item.appendChild(text);

            item.appendChild(actions);


            historyBlock.appendChild(item);

        }
    );

}



/* =================================================
   EDIT
================================================= */

function editPost(post){

    if(
        post.id === null ||
        post.id === undefined
    ){

        alert(
            "Ошибка: у публикации отсутствует ID."
        );

        return;
    }


    editIdInput.value =
        String(post.id);

    typeInput.value =
        post.section;

    contentInput.value =
        post.content || "";


    editorTitle.textContent =
        "Редактирование публикации";


    saveButton.textContent =
        "Сохранить изменения";


    editorPanel.classList.add(
        "editing"
    );


    saveStatus.textContent =
        "";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}



/* =================================================
   DELETE
================================================= */

async function deletePost(id){

    if(
        id === null ||
        id === undefined ||
        id === ""
    ){

        alert(
            "Ошибка: отсутствует ID публикации."
        );

        return;
    }


    const numericId =
        Number(id);


    if(
        !Number.isInteger(numericId)
    ){

        alert(
            "Ошибка: неправильный ID публикации."
        );

        return;
    }


    const confirmed =
        confirm(
            "Удалить эту публикацию?"
        );


    if(!confirmed){
        return;
    }


    const deleteButton =
        event &&
        event.target;


    if(deleteButton){

        deleteButton.disabled =
            true;

    }


    /*
     * Удаляем именно строку
     * с указанным bigint ID.
     */

    const result =
        await supabaseClient
            .from("site_content")
            .delete()
            .eq(
                "id",
                numericId
            )
            .select("id");


    if(result.error){

        alert(
            "Ошибка удаления: " +
            result.error.message
        );

        await loadHistory();

        return;
    }


    if(
        !result.data ||
        result.data.length === 0
    ){

        alert(
            "Supabase не удалил запись. " +
            "Проверьте DELETE policy для site_content."
        );

        await loadHistory();

        return;
    }


    if(
        editIdInput.value ===
        String(numericId)
    ){

        clearEditor();

    }


    await loadHistory();

}



/* =================================================
   CLEAR
================================================= */

clearButton.addEventListener(
    "click",
    clearEditor
);


function clearEditor(){

    typeInput.value =
        "news";

    contentInput.value =
        "";

    editIdInput.value =
        "";


    editorTitle.textContent =
        "Новая публикация";


    saveButton.textContent =
        "Опубликовать";


    editorPanel.classList.remove(
        "editing"
    );


    saveStatus.textContent =
        "";

}



/* =================================================
   RESET SAVE BUTTON
================================================= */

function resetSaveButton(){

    saveButton.disabled =
        false;

    saveButton.textContent =
        editIdInput.value
        ? "Сохранить изменения"
        : "Опубликовать";

}



/* =================================================
   LOGOUT
================================================= */

logoutButton.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        location.reload();

    }
);



/* =================================================
   STATUS
================================================= */

function setStatus(
    element,
    text,
    type
){

    element.textContent =
        text;

    element.className =
        "status";


    if(type){

        element.classList.add(
            type
        );

    }

}



/* =================================================
   DATE
================================================= */

function formatDate(date){

    if(!date){
        return "";
    }


    const d =
        new Date(date);


    if(
        Number.isNaN(
            d.getTime()
        )
    ){

        return "";

    }


    return d.toLocaleString(
        "ru-RU"
    );

}



/* =================================================
   ESCAPE
================================================= */

function escapeHtml(text){

    return String(text || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



/*
