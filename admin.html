/* =================================================
   SUPABASE
================================================= */

const SUPABASE_URL =
    "https://gcwjtsqnmfimqdoyhfar.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Y-QSCei2FKGVHaoI3TG7ng_ldK08d0w";

let supabaseClient = null;


/* =================================================
   СОЗДАНИЕ CLIENT
================================================= */

try{

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

}catch(error){

    console.error(
        "Supabase initialization error:",
        error
    );

}


/* =================================================
   ELEMENTS
================================================= */

const loginBlock =
    document.getElementById("login");

const appBlock =
    document.getElementById("app");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const loginStatus =
    document.getElementById("loginStatus");

const userInfo =
    document.getElementById("userInfo");

const typeInput =
    document.getElementById("type");

const contentInput =
    document.getElementById("content");

const editIdInput =
    document.getElementById("editId");

const saveButton =
    document.getElementById("saveButton");

const clearButton =
    document.getElementById("clearButton");

const saveStatus =
    document.getElementById("saveStatus");

const historyBlock =
    document.getElementById("history");

const editorTitle =
    document.getElementById("editorTitle");

const editorPanel =
    document.getElementById("editorPanel");

const logoutButton =
    document.getElementById("logoutButton");


/* =================================================
   LOGIN
================================================= */

loginButton.addEventListener(
    "click",
    login
);


async function login(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!supabaseClient){

        showLoginError(
            "Supabase не загрузился."
        );

        return;

    }


    if(!email){

        showLoginError(
            "Введите email."
        );

        return;

    }


    if(!password){

        showLoginError(
            "Введите пароль."
        );

        return;

    }


    loginButton.disabled =
        true;

    loginButton.textContent =
        "Вход...";


    loginStatus.className =
        "status";

    loginStatus.textContent =
        "Проверка данных...";


    try{

        const result =
            await supabaseClient.auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


        if(result.error){

            showLoginError(
                result.error.message
            );

            return;

        }


        if(
            !result.data ||
            !result.data.session
        ){

            showLoginError(
                "Сессия не была создана."
            );

            return;

        }


        loginStatus.className =
            "status success";

        loginStatus.textContent =
            "Вход выполнен!";


        await showApp(
            result.data.user
        );


    }catch(error){

        showLoginError(
            "Ошибка: " +
            error.message
        );

    }finally{

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Войти";

    }

}


function showLoginError(message){

    loginStatus.className =
        "status error";

    loginStatus.textContent =
        "Ошибка: " +
        message;

}


/* =================================================
   ENTER
================================================= */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


/* =================================================
   SHOW APP
================================================= */

async function showApp(user){

    loginBlock.style.display =
        "none";

    appBlock.style.display =
        "block";


    if(user){

        userInfo.textContent =
            "Выполнен вход: " +
            (user.email || "");

    }


    await loadHistory();

}


/* =================================================
   CHECK SESSION
================================================= */

async function checkSession(){

    if(!supabaseClient){

        loginStatus.className =
            "status error";

        loginStatus.textContent =
            "Supabase не загрузился.";

        return;

    }


    try{

        const result =
            await supabaseClient.auth
                .getSession();


        if(
            result.data &&
            result.data.session
        ){

            await showApp(
                result.data.session.user
            );

        }else{

            loginStatus.className =
                "status";

            loginStatus.textContent =
                "Введите email и пароль.";

        }

    }catch(error){

        loginStatus.className =
            "status error";

        loginStatus.textContent =
            "Ошибка проверки сессии: " +
            error.message;

    }

}


/* =================================================
   SAVE / UPDATE
================================================= */

saveButton.addEventListener(
    "click",
    savePost
);


async function savePost(){

    const section =
        typeInput.value;

    const text =
        contentInput.value.trim();

    const rawId =
        editIdInput.value.trim();


    if(!text){

        saveStatus.className =
            "status error";

        saveStatus.textContent =
            "Введите текст публикации.";

        return;

    }


    let numericId = null;


    if(rawId !== ""){

        numericId =
            Number(rawId);


        if(
            !Number.isInteger(
                numericId
            )
        ){

            saveStatus.className =
                "status error";

            saveStatus.textContent =
                "Неверный ID публикации.";

            return;

        }

    }


    saveButton.disabled =
        true;


    saveButton.textContent =
        numericId !== null
        ? "Сохранение..."
        : "Публикация...";


    saveStatus.className =
        "status";

    saveStatus.textContent =
        "Обработка...";


    try{

        let result;


        /* =========================
           UPDATE
        ========================= */

        if(numericId !== null){

            result =
                await supabaseClient
                    .from("site_content")
                    .update({

                        section:section,

                        content:text,

                        updated_at:
                            new Date()
                                .toISOString()

                    })
                    .eq(
                        "id",
                        numericId
                    );


        /* =========================
           INSERT
        ========================= */

        }else{

            result =
                await supabaseClient
                    .from("site_content")
                    .insert({

                        section:section,

                        content:text

                    });

        }


        if(result.error){

            throw result.error;

        }


        saveStatus.className =
            "status success";

        saveStatus.textContent =
            numericId !== null
            ? "Изменения сохранены!"
            : "Публикация добавлена!";


        clearEditor();

        await loadHistory();


    }catch(error){

        saveStatus.className =
            "status error";

        saveStatus.textContent =
            "Ошибка: " +
            error.message;

    }finally{

        saveButton.disabled =
            false;

        saveButton.textContent =
            editIdInput.value
            ? "Сохранить изменения"
            : "Опубликовать";

    }

}


/* =================================================
   LOAD HISTORY
================================================= */

async function loadHistory(){

    historyBlock.innerHTML =
        '<div class="status">Загрузка...</div>';


    try{

        const result =
            await supabaseClient
                .from("site_content")
                .select(
                    "id, section, content, created_at, updated_at"
                )
                .in(
                    "section",
                    [
                        "news",
                        "contest"
                    ]
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(result.error){

            throw result.error;

        }


        const posts =
            result.data || [];


        if(posts.length === 0){

            historyBlock.innerHTML =
                '<div class="empty">' +
                "Публикаций пока нет." +
                "</div>";

            return;

        }


        historyBlock.innerHTML =
            "";


        posts.forEach(
            function(post){

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "item";


                const type =
                    document.createElement(
                        "div"
                    );

                type.className =
                    "item-type";

                type.textContent =
                    post.section === "contest"
                    ? "КОНКУРС"
                    : "НОВОСТЬ";


                const date =
                    document.createElement(
                        "div"
                    );

                date.className =
                    "item-date";

                date.textContent =
                    formatDate(
                        post.updated_at ||
                        post.created_at
                    );


                const text =
                    document.createElement(
                        "div"
                    );

                text.className =
                    "item-text";

                text.textContent =
                    post.content || "";


                const actions =
                    document.createElement(
                        "div"
                    );

                actions.className =
                    "actions";


                const editButton =
                    document.createElement(
                        "button"
                    );

                editButton.className =
                    "primary";

                editButton.textContent =
                    "Изменить";


                editButton.addEventListener(
                    "click",
                    function(){

                        startEdit(post);

                    }
                );


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "danger";

                deleteButton.textContent =
                    "Удалить";


                deleteButton.addEventListener(
                    "click",
                    function(){

                        deletePost(
                            post.id
                        );

                    }
                );


                actions.appendChild(
                    editButton
                );

                actions.appendChild(
                    deleteButton
                );


                item.appendChild(type);

                item.appendChild(date);

                item.appendChild(text);

                item.appendChild(actions);


                historyBlock.appendChild(
                    item
                );

            }
        );


    }catch(error){

        historyBlock.innerHTML =
            '<div class="status error">' +
            "Ошибка загрузки: " +
            escapeHtml(
                error.message
            ) +
            "</div>";

    }

}


/* =================================================
   START EDIT
================================================= */

function startEdit(post){

    if(
        post.id === null ||
        post.id === undefined
    ){

        alert(
            "У публикации отсутствует ID."
        );

        return;

    }


    editIdInput.value =
        String(post.id);

    typeInput.value =
        post.section;

    contentInput.value =
        post.content || "";


    editorTitle.textContent =
        "Редактирование публикации";


    saveButton.textContent =
        "Сохранить изменения";


    editorPanel.classList.add(
        "editing"
    );


    saveStatus.textContent =
        "";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =================================================
   DELETE
================================================= */

async function deletePost(id){

    const numericId =
        Number(id);


    if(
        !Number.isInteger(
            numericId
        )
    ){

        alert(
            "Неверный ID публикации."
        );

        return;

    }


    const confirmed =
        confirm(
            "Удалить эту публикацию?"
        );


    if(!confirmed){

        return;

    }


    try{

        const result =
            await supabaseClient
                .from("site_content")
                .delete()
                .eq(
                    "id",
                    numericId
                );


        if(result.error){

            throw result.error;

        }


        if(
            editIdInput.value ===
            String(numericId)
        ){

            clearEditor();

        }


        await loadHistory();


        saveStatus.className =
            "status success";

        saveStatus.textContent =
            "Публикация удалена!";


    }catch(error){

        alert(
            "Ошибка удаления: " +
            error.message
        );

    }

}


/* =================================================
   CLEAR
================================================= */

clearButton.addEventListener(
    "click",
    clearEditor
);


function clearEditor(){

    typeInput.value =
        "news";

    contentInput.value =
        "";

    editIdInput.value =
        "";


    editorTitle.textContent =
        "Новая публикация";


    saveButton.textContent =
        "Опубликовать";


    editorPanel.classList.remove(
        "editing"
    );

}


/* =================================================
   LOGOUT
================================================= */

logoutButton.addEventListener(
    "click",
    async function(){

        try{

            await supabaseClient.auth.signOut();

        }finally{

            location.reload();

        }

    }
);

   DATE

        )
    ){

        return "";

    }


    return d.toLocaleString(
