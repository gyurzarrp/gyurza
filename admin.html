    "https://gcwjtsqnmfimqdoyhfar.supabase.co";

const SUPABASE_KEY =

const supabaseClient =

/* =================================================

const login =

    document.getElementById("password");

    document.getElementById("loginButton");

const loginStatus =
    document.getElementById("loginStatus");

const userEmail =
    document.getElementById("userEmail");

const type =
    document.getElementById("type");

const content =
    document.getElementById("content");

const editId =
    document.getElementById("editId");

const saveButton =
    document.getElementById("saveButton");

const clearButton =
    document.getElementById("clearButton");

const saveStatus =
    document.getElementById("saveStatus");

const history =
    document.getElementById("history");

const editorTitle =
    document.getElementById("editorTitle");

const editorPanel =
    document.getElementById("editorPanel");

const logoutButton =

/* =================================================
   LOGIN
================================================= */

loginButton.addEventListener(
    "click",
    loginUser
);


password.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            loginUser();

        }

    }
);


async function loginUser(){

    const emailValue =
        email.value.trim();

    const passwordValue =
        password.value;


    if(!emailValue){

        setStatus(
            loginStatus,
            "Введите email.",
            "error"
        );

        return;

    }


    if(!passwordValue){

        setStatus(
            loginStatus,
            "Введите пароль.",
            "error"
        );

        return;

    }


    loginButton.disabled =
        true;

    loginButton.textContent =
        "Вход...";


    setStatus(
        loginStatus,
        "Подключение...",
        ""
    );


    try{

        const result =
            await supabaseClient.auth
            .signInWithPassword({

                email:
                    emailValue,

                password:
                    passwordValue

            });


        console.log(
            "LOGIN RESULT:",
            result
        );


        if(result.error){

            setStatus(
                loginStatus,
                "Ошибка входа: " +
                result.error.message,
                "error"
            );

            return;

        }


        if(
            !result.data ||
            !result.data.session
        ){

            setStatus(
                loginStatus,
                "Вход не выполнен: Supabase не создал сессию.",
                "error"
            );

            return;

        }


        setStatus(
            loginStatus,
            "Вход выполнен!",
            "success"
        );


        await openAdmin();


    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        setStatus(
            loginStatus,
            "Ошибка подключения: " +
            error.message,
            "error"
        );

    }finally{

        loginButton.disabled =
            false;

        loginButton.textContent =
            "Войти";

    }

}


/* =================================================
   OPEN ADMIN
================================================= */

async function openAdmin(){

    login.style.display =
        "none";

    app.style.display =
        "block";


    const result =
        await supabaseClient.auth
        .getUser();


    if(
        result.data &&
        result.data.user
    ){

        userEmail.textContent =
            "Вы вошли как: " +
            result.data.user.email;

    }


    await loadHistory();

}


/* =================================================
   CHECK SESSION
================================================= */

async function checkSession(){

    try{

        const result =
            await supabaseClient.auth
            .getSession();


        if(
            result.data &&
            result.data.session
        ){

            await openAdmin();

        }

    }catch(error){

        console.error(
            "SESSION ERROR:",
            error
        );

    }

}


/* =================================================
   SAVE
================================================= */

saveButton.addEventListener(
    "click",
    savePost
);


async function savePost(){

    const section =
        type.value;

    const text =
        content.value.trim();

    const id =
        editId.value.trim();


    if(!text){

        setStatus(
            saveStatus,
            "Введите текст публикации.",
            "error"
        );

        return;

    }


    saveButton.disabled =
        true;


    saveButton.textContent =
        id
        ? "Сохранение..."
        : "Публикация...";


    try{

        let result;


        /* UPDATE */

        if(id){

            const numericId =
                Number(id);


            if(
                !Number.isInteger(numericId)
            ){

                throw new Error(
                    "Неверный ID публикации."
                );

            }


            result =
                await supabaseClient
                .from("site_content")
                .update({

                    section:
                        section,

                    content:
                        text,

                    updated_at:
                        new Date()
                        .toISOString()

                })
                .eq(
                    "id",
                    numericId
                )
                .select();


            if(result.error){

                throw result.error;

            }


            if(
                !result.data ||
                result.data.length === 0
            ){

                throw new Error(
                    "Запись не изменена. Возможно, UPDATE запрещён политикой RLS."
                );

            }


            setStatus(
                saveStatus,
                "Изменения сохранены!",
                "success"
            );

        }


        /* INSERT */

        else{

            result =
                await supabaseClient
                .from("site_content")
                .insert({

                    section:
                        section,

                    content:
                        text

                })
                .select();


            if(result.error){

                throw result.error;

            }


            setStatus(
                saveStatus,
                "Публикация добавлена!",
                "success"
            );

        }


        clearEditor();

        await loadHistory();


    }catch(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        setStatus(
            saveStatus,
            "Ошибка: " +
            error.message,
            "error"
        );

    }finally{

        saveButton.disabled =
            false;

        saveButton.textContent =
            editId.value
            ? "Сохранить изменения"
            : "Опубликовать";

    }

}


/* =================================================
   LOAD HISTORY
================================================= */

async function loadHistory(){

    history.innerHTML =
        '<div class="status">Загрузка...</div>';


    try{

        const result =
            await supabaseClient
            .from("site_content")
            .select(
                "id,section,content,created_at,updated_at"
            )
            .in(
                "section",
                [
                    "news",
                    "contest"
                ]
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(result.error){

            throw result.error;

        }


        const posts =
            result.data || [];


        if(posts.length === 0){

            history.innerHTML =
                '<div class="empty">' +
                'Публикаций пока нет.' +
                '</div>';

            return;

        }


        history.innerHTML =
            "";


        posts.forEach(
            function(post){

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "item";


                const typeText =
                    document.createElement(
                        "div"
                    );

                typeText.className =
                    "item-type";

                typeText.textContent =
                    post.section === "contest"
                    ? "КОНКУРС"
                    : "НОВОСТЬ";


                const date =
                    document.createElement(
                        "div"
                    );

                date.className =
                    "item-date";

                date.textContent =
                    formatDate(
                        post.updated_at ||
                        post.created_at
                    );


                const text =
                    document.createElement(
                        "div"
                    );

                text.className =
                    "item-text";

                text.textContent =
                    post.content || "";


                const actions =
                    document.createElement(
                        "div"
                    );

                actions.className =
                    "actions";


                const edit =
                    document.createElement(
                        "button"
                    );

                edit.className =
                    "primary";

                edit.type =
                    "button";

                edit.textContent =
                    "Изменить";


                edit.onclick =
                    function(){

                        editPost(post);

                    };


                const remove =
                    document.createElement(
                        "button"
                    );

                remove.className =
                    "danger";

                remove.type =
                    "button";

                remove.textContent =
                    "Удалить";


                remove.onclick =
                    function(){

                        deletePost(
                            post.id
                        );

                    };


                actions.appendChild(
                    edit
                );

                actions.appendChild(
                    remove
                );


                item.appendChild(
                    typeText
                );

                item.appendChild(
                    date
                );

                item.appendChild(
                    text
                );

                item.appendChild(
                    actions
                );


                history.appendChild(
                    item
                );

            }
        );


    }catch(error){

        console.error(
            "HISTORY ERROR:",
            error
        );


        history.innerHTML =
            '<div class="error">' +
            'Ошибка: ' +
            escapeHtml(
                error.message
            ) +
            '</div>';

    }

}


/* =================================================
   EDIT
================================================= */

function editPost(post){

    if(
        post.id === null ||
        post.id === undefined
    ){

        alert(
            "У этой публикации нет ID."
        );

        return;

    }


    editId.value =
        String(post.id);

    type.value =
        post.section;

    content.value =
        post.content || "";


    editorTitle.textContent =
        "Редактирование публикации";


    saveButton.textContent =
        "Сохранить изменения";


    editorPanel.classList.add(
        "editing"
    );


    saveStatus.textContent =
        "";


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =================================================
   DELETE
================================================= */

async function deletePost(id){

    if(
        id === null ||
        id === undefined ||
        id === ""
    ){

        alert(
            "Ошибка: ID публикации отсутствует."
        );

        return;

    }


    const numericId =
        Number(id);


    if(
        !Number.isInteger(numericId)
    ){

        alert(
            "Ошибка: неправильный ID."
        );

        return;

    }


    if(
        !confirm(
            "Удалить эту публикацию?"
        )
    ){

        return;

    }


    try{

        const result =
            await supabaseClient
            .from("site_content")
            .delete()
            .eq(
                "id",
                numericId
            )
            .select("id");


        if(result.error){

            throw result.error;

        }


        if(
            !result.data ||
            result.data.length === 0
        ){

            throw new Error(
                "Удаление запрещено политикой RLS или запись не найдена."
            );

        }


        if(
            editId.value ===
            String(numericId)
        ){

            clearEditor();

        }


        await loadHistory();


    }catch(error){

        console.error(
            "DELETE ERROR:",
            error
        );


        alert(
            "Ошибка удаления: " +
            error.message
        );

    }

}


/* =================================================
   CLEAR
================================================= */

clearButton.addEventListener(
    "click",
    clearEditor
);


function clearEditor(){

    type.value =
        "news";

    content.value =
        "";

    editId.value =
        "";


    editorTitle.textContent =
        "Новая публикация";


    saveButton.textContent =
        "Опубликовать";


    editorPanel.classList.remove(
        "editing"
    );


    saveStatus.textContent =
        "";

}


/* =================================================
   LOGOUT
================================================= */

logoutButton.addEventListener(
    "click",
    async function(){

        await supabaseClient.auth.signOut();

        location.reload();

    }
);


/* =================================================
   STATUS
================================================= */

function setStatus(
    element,
    text,
    className
){

    element.textContent =
        text;

    element.className =
        "status";


    if(className){

        element.classList.add(
            className
        );

    }

}

============
